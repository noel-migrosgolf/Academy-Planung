<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academy Planung</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6b4f'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div>
        <div class="brand-name">Academy Holzhäusern</div>
        <div class="brand-sub">Planungstool</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="session-info" class="session-info" hidden></span>
      <button id="btn-users" class="btn btn-ghost" hidden>Benutzer</button>
      <button id="btn-admin" class="btn btn-ghost">Admin</button>
      <button id="btn-logout" class="btn btn-ghost" hidden>Abmelden</button>
    </div>
  </header>

  <!-- Login -->
  <main id="view-login" class="view view-center">
    <form id="login-form" class="card login-card" autocomplete="on">
      <h1>Anmelden</h1>
      <p class="muted">Melde dich mit deinem Benutzerkonto an.</p>
      <label>Benutzername
        <input name="username" type="text" autocomplete="username" required>
      </label>
      <label>Passwort
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
    </form>
  </main>

  <!-- Kalender -->
  <main id="view-calendar" class="view" hidden>
    <div class="page-head">
      <div>
        <h1>Jahreskalender <span id="cal-year"></span></h1>
        <p class="muted">Schulferien und schulfreie Tage Kanton Zug</p>
      </div>
      <div class="legend-keys">
        <span class="key ferien">Schulferien</span>
        <span class="key feiertag">Schulfreier Tag</span>
        <span class="key weekend">Wochenende</span>
      </div>
    </div>
    <div class="calendar-layout">
      <div id="calendar" class="calendar"></div>
      <aside class="card legend">
        <h2>Ferien &amp; Feiertage</h2>
        <div id="legend"></div>
      </aside>
    </div>
  </main>

  <!-- Admin-Login -->
  <dialog id="dlg-admin-login" class="dialog">
    <form id="admin-login-form" method="dialog">
      <h2>Admin-Bereich</h2>
      <label>Admin-Passwort
        <input name="password" type="password" autocomplete="off" required autofocus>
      </label>
      <p class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>Abbrechen</button>
        <button class="btn btn-primary" type="submit">Weiter</button>
      </div>
    </form>
  </dialog>

  <!-- Benutzerverwaltung -->
  <dialog id="dlg-users" class="dialog dialog-wide">
    <div class="dialog-head">
      <h2>Benutzerverwaltung</h2>
      <button class="btn btn-icon" type="button" data-close aria-label="Schliessen">×</button>
    </div>
    <form id="user-form" class="user-form">
      <label>Name
        <input name="name" type="text" required>
      </label>
      <label>Benutzername
        <input name="username" type="text" autocomplete="off" required>
      </label>
      <label>Passwort
        <input name="password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button class="btn btn-primary" type="submit">Benutzer anlegen</button>
      <p class="form-error" role="alert"></p>
    </form>
    <table class="user-table">
      <thead>
        <tr><th>Name</th><th>Benutzername</th><th>Erstellt</th><th></th></tr>
      </thead>
      <tbody id="user-list"></tbody>
    </table>
    <p id="user-empty" class="muted">Noch keine Benutzer angelegt.</p>
  </dialog>

  <script src="js/ferien.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
